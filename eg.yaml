# ============================================================================
# Unified Metadata YAML Template for README.md and page assets.
# ============================================================================
# NOTE:
# - Canonical field names are the top-level keys in this file.
# - `alias` is DEPRECATED and kept only for backward compatibility.
# - External metadata should use canonical keys only.

# ========== HuggingFace Hub Configuration (README yaml)==========
# ---------- Start of the Yaml part of README ----------
# ------------------------------------------------------

task_categories:
  value: null
  required: true
  source: "fixed"
  alias: null
  default: "robotics"
# Task category labels, server as a label in huggingface hub.

language:
  value: null
  required: true
  source: "fixed"
  alias: null
  default: "en"
# Supported languages, server as a label in huggingface hub.

tags:
  value: null
  required: true
  source: "fixed"
  alias: null
  default:
    - "RoboCOIN"
    - "LeRobot"
# Dataset tags, server as a label in huggingface hub.

license:
  value: null
  required: true
  source: "fixed"
  alias:
    - "dataset_license"
  default: "apache-2.0"
# License type, server as a label in huggingface hub.

configs:
  value: null
  required: true
  source: "fixed"
  alias: null
  default: "default"
# Data file configuration

# ========== Gated Dataset Configuration ==========

extra_gated_prompt:
  value: null
  required: true
  source: "fixed"
  alias: null
  default: >-
    By accessing this dataset, you agree to cite the associated paper in your
    research/publications—see the "Citation" section for details. You agree to not
    use the dataset to conduct experiments that cause harm to human subjects.

extra_gated_fields:
  value: null
  required: true
  source: "fixed"
  alias: null
  default:
    Company/Organization:
      type: text
      description: e.g., "ETH Zurich", "Boston Dynamics", "Independent Researcher"
    Country:
      type: country
      description: e.g., "Germany", "China", "United States"
# Fields to be filled when accessing

# ---------- End of the Yaml part of README ----------
######################################################

# ========== Basic Information ==========

codebase_version:
  value: null
  required: true
  source: "fixed"
  alias: null
  default: "v2.1"
# that is codebase_version, get from local_dataset_info.yaml

dataset_name:
  value: null
  required: true
  source: "local_dataset_info.yaml"
  alias:
    - "task_name"
  default: "{robot_name}_{action}_{object}"
# Dataset Name, format: {robot}_{task_name}

dataset_uuid:
  value: null
  required: true
  source: "local_dataset_info.yaml"
  alias: null
  default: "00000000-0000-0000-0000-000000000000"
# Dataset UUID (usually auto-generated)

# ========== Environment Information ==========
scene_type:
  value: null
  required: true
  source: "local_dataset_info.yaml"
  alias:
    - "scene_level1"
    - "scene_level2"
    - "scene_level3"
    - "scene_level4"
    - "scene_level5"
    - "scene_level"
  default:
    level1: "scene_level1"
    level2: "scene_level2"
    level3: null
    level4: null
    level5: null
# Strictly fill in according to the scene library.
# --- README -----
# e.g. Catering-Restaurant.
# MUST follow the format: level1-level2-...
# ----------------

env_type:
  value: null
  required: true
  source: "local_dataset_info.yaml"
  alias: null
  default: "Due to some reasons, this dataset temporarily cannot provide the environment type information."
# --- README -----
# simulation/real.
# MUST follow the format: simulation/real_world. one in two choices
# ----------------

objects:
  value: null
  required: true
  source: "local_dataset_info.yaml"
  alias: null
  default:
    object_name: "object_name"
    color: "color"
    level1: "object"
    level2: "object"
    level3: null
    level4: null
    level5: null
# that is object_list, get from local_dataset_info.yaml
# --- README -----
# furniture-table.
# container-basket.
# MUST follow the format: object_name-level1-level2-...
# ----------------

# ========== Task Information ==========

task_operation_type:
  value: null
  required: true
  source: "local_dataset_info.yaml"
  alias: null
  default: "Due to some reasons, this dataset temporarily cannot provide the operation type information."
# dual_arm..., that is task_type.
# --- README -----
# simgle_arm/dual_arm/othes...
# MUST follow the format: simgle_arm/dual_arm/others... Choose one.
# ----------------

task_result:
  value: null
  # e.g.
  #   success/failure
  required: optional
  source: "annotations/subtask_annotations.jsonl"
  alias: null
  default: "null"
# --- README -----
# success/failure.
# MUST follow the format: success/failure. one in two choices
# ----------------

task_instruction:
  value: null
  # e.g.
  #   "put_apple_into_basket"
  required: true
  source: "local_dataset_info.yaml"
  alias:
    - "tasks"
    # Legacy compat: `pre_local_datasets_info.yaml` uses `task_descriptions`
    # (old field name) to store the main natural-language task instruction.
    # Purpose: map old `task_descriptions` -> standardized `task_instruction`.
    - "task_descriptions"
  default: "task_instruction"
# i.e. task_instruction, this is the natural language instruction.
# NOTE: MUST distinguish the task_instruction from task_descriptions.
# former is the natural language instruction, latter is the task sub-process description.(How to do the task)
# ----------------
# NOW, the task_instruction is the MAIN instruction in local_dataset_info.yaml,
# which is aligned to this yaml template. Here only use the first instruction as the MAIN instruction.
# bucause task_description is redundant with sub_tasks and deprecated, so we don't need to use it.
# ----------------

sub_tasks:
  value: null
  required: true
  source: "annotations/subtask_annotations.jsonl"
  alias:
    - "task_description"
  default:
    - "sub_task_1"
    - "sub_task_2"
    - "sub_task_3"
# that is subtask_list, get from annotations/subtask_annotations.jsonl
# NOTE: Is redundent with task_description, but here we keep it for compatibility.
# ONLY used as a reference for the task description.
# ----------------

atomic_actions:
  value: null
  required: true
  source: "local_dataset_info.yaml"
  alias: null
  default:
    - "atomic_action_1"
    - "atomic_action_2"
    - "atomic_action_3"
# that is so-called skill_list, get from local_dataset_info.yaml

# ========== Robot Configuration Info ==========

robot_name:
  value: null
  # e.g.
  #   "Agibot_g1"
  required: true
  source: "local_dataset_info.yaml"
  alias:
    - "device_model"
  default: "{manufacturer}+{robot_type}"
# "{Manifacurer}+{robot_type}"
# is device_model in local_dataset_info.yaml

end_effector_type:
  value: null
  # e.g.
  #   "two_finger_gripper"
  required: true
  source: "local_dataset_info.yaml"
  alias: null
  default: "end_effector_type"

tele_type:
  value: null
  # e.g.
  #   "master_arm"
  required: true
  source: "local_dataset_info.yaml"
  alias: null
  default: "Due to some reasons, this dataset temporarily cannot provide the teleoperation type information."

sensor_list:
  value: null
  required: true
  source: "meta/info.json"
  alias: null
  default: 
    - "sensor_1"
    - "sensor_2"
    - "sensor_3"
# Read from meta/info.json, from features.observation.<sensor_name,Iter items here.>
# usually have images and state.

came_info:
  value: null
  required: true
  source: "meta/info.json"
  alias:
    - "camera_info"
  default:
    observation.images.cam_name_1: "resolution_1"
    observation.images.cam_name_2: "resolution_2"
# CANNOT get from data providers usually. backward to resolution of the camera.

depth_enabled:
  value: null
  required: true
  source: "meta/info.json"
  alias: null
  default: "depth_enabled"
# Whether depth images are included (auto-calculated from features)

# ========== Coordinate Information ==========
########################################
# BELOW is to-be-checked if necessary. #
########################################

coordinate_definition:
  value: null
  required: true
  source: "fixed"
  alias: null
  default: "right-hand-frame"
# single str. directly display.

origin_xyz:
  value: null
  required: false
  source: "urdf"
  alias: null
  default: "origin_xyz"
# list of 3 floats. directly display.

#####################################
# UP is to-be-checked if necessary. #
#####################################

# ========== Dimension Information ==========

joint_rotation_dim:
  value: null
  required: true
  source: "meta/info.json"
  alias: null
  default: "joint_rotation_dim"
# choose from: radian, degree.
# single str. directly display.

end_rotation_dim:
  value: null
  required: true
  source: "meta/info.json"
  alias: null
  default: "end_rotation_dim"
# choose from: radian, degree.
# single str. directly display.
# that is the rotation dimension of the end effector.

end_translation_dim:
  value: null
  required: true
  source: "meta/info.json"
  alias: null
  default: "end_translation_dim"
# choose from: meter, millimeter.
# single str. directly display.
# that is the translation dimension of the end effector.

base_robtation_dim:
  value: null
  required: optional
  source: "meta/info.json"
  alias:
    - "base_rotation_dim"
  default: "base_rotation_dim"
# choose from: radian, degree.
# single str. directly display.
# that is the rotation dimension of the base of the robot.

base_translation_dim:
  value: null
  required: optional
  source: "meta/info.json"
  alias: null
  default: "base_translation_dim"
# choose from: meter, millimeter.
# single str. directly display.
# that is the translation dimension of the base of the robot.

# ========== Annotation Information ==========

annotations:
  value: null
  required: optional
  source: "annotations/"
  alias: null
